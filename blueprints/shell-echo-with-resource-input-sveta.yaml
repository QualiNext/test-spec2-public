spec_version: 2
description: shell output resource inputs

inputs:
  agent_name:
    type: agent

  # azure_provider:
  #   type: target
  #   target-filters:
  #     cloud-providers:
  #       - azure

  azure_resource_type:
    type: string
    default: Microsoft.Storage/storageAccounts
    allowed-values:
      - Microsoft.Storage/storageAccounts
      - Microsoft.Compute/virtualMachines
  
  azure_single_resource:
    type: resource
    depends-on: azure_provider, azure_resource_type
    resource-selector:
      # provider-name: '{{ .inputs.azure_provider }}'
      type: '{{ .inputs.azure_resource_type }}'
  
  azure_multi_resource:
    type: resource
    depends-on: azure_provider, azure_resource_type
    style: multi-select
    resource-selector:
      # provider-name: '{{ .inputs.azure_provider }}'
      type: '{{ .inputs.azure_resource_type }}'

outputs:
  output_single:
    value: '{{ .grains.echo.activities.deploy.commands.echo_single.outputs.output1 }}'
  output_multi:
    value: '{{ .grains.echo.activities.deploy.commands.echo_multi.outputs.output1 }}'

grains:
  echo:
    kind: shell
    spec:
      agent:
        name: '{{.inputs.agent_name}}'
      activities:
        deploy:
          commands:
            - name: 'echo_single'
              command: 'export output1=''{{ .inputs.azure_single_resource | resource_property: "external_id" }}''; echo $output1;'
              outputs:
                - output1
            - name: 'echo_multi'
              command: 'export output1=''{{ .inputs.azure_multi_resource | resource_property: "external_id" }}''; echo $output1;'
              outputs:
                - output1
