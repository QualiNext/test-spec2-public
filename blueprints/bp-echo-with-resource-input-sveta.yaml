spec_version: 2
description: output intput

inputs:
  azure_provider:
    type: target
    target-filters:
      cloud-providers:
        - azure

  azure_resource_type:
    type: string
    default: Microsoft.Storage/storageAccounts
    allowed-values:
      - Microsoft.Storage/storageAccounts
      - Microsoft.Compute/virtualMachines
  
  azure_single_resource:
    type: resource
    depends-on: azure_provider, azure_resource_type
    resource-selector:
      provider-name: '{{ .inputs.azure_provider }}'
      type: '{{ .inputs.azure_resource_type }}'
  
  azure_multi_resource:
    type: resource
    depends-on: azure_provider, azure_resource_type
    style: multi-select
    resource-selector:
      provider-name: '{{ .inputs.azure_provider }}'
      type: '{{ .inputs.azure_resource_type }}'

outputs:
  azure_single_resource_name:
    value: '{{ .inputs.azure_single_resource | resource_property: "name" }}'
  azure_single_resource_external_id:
    value: '{{ .inputs.azure_single_resource | resource_property: "external_id" }}'
  azure_single_resource_object:
    value: '{{ .inputs.azure_single_resource | resource_object }}'
  azure_multi_resource_name:
    value: '{{ .inputs.azure_multi_resource | resource_property: "name" }}'
  azure_multi_resource_external_ids:
    value: '{{ .inputs.azure_multi_resource | resource_property: "external_id" }}'
  azure_multi_resource_objects:
    value: '{{ .inputs.azure_multi_resource | resource_object }}'